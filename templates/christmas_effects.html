<div class="winter-sky" aria-hidden="true">
  <div class="aurora aurora-green"></div><div class="aurora aurora-violet"></div>
  <div class="sky-stars">
    {% for i in range(65) %}
    <span class="sky-star" style="--x: {{ (i * 37 + 3) % 100 }}%; --y: {{ (i * 23 + 5) % 76 }}%; --size: {{ 1 + i % 3 }}px; --delay: -{{ i % 9 }}s; --duration: {{ 3 + i % 5 }}s;"></span>
    {% endfor %}
  </div>
  {% include "kaiju_battle.html" %}
  <div class="winter-city"></div>
</div>
<div class="christmas-effects" aria-hidden="true">
  <div class="snowfall">
    {% for i in range(36) %}
    <span class="snowflake" style="--x: {{ (i * 37) % 100 }}%; --size: {{ 2 + i % 4 }}px; --duration: {{ 10 + i % 11 }}s; --delay: -{{ i * 1.7 }}s; --drift: {{ (i % 5 - 2) * 12 }}px;"></span>
    {% endfor %}
  </div>
  <div class="santa-route"><div class="santa-facing">
    <svg class="santa-sleigh" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" focusable="false">
      <defs>

          <circle cx="93" cy="36" r="2" fill="#292c32"/><circle cx="103" cy="40" r="4" fill="#e34449"/>
          <path d="m72 49 9 7" stroke="#bb3342" stroke-width="6"/><circle cx="80" cy="56" r="3" fill="#f3ca67"/>
          <g class="reindeer-legs" fill="none" stroke="#875032" stroke-width="5" stroke-linecap="round">

          </g>

      <path d="m56 65 28 13 20-10" fill="none" stroke="#cf3c4b" stroke-width="10" stroke-linecap="round"/>
